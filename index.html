function tabs(){$('tabs').innerHTML=[{n:'الكل'}].concat(D).map((c,i)=>`<button class="tab ${cat===i-1?'on':''}" onclick="setCat(${i-1})">${c.n}</button>`).join('')}
function setCat(i){cat=i;tabs();render();scrollTo({top:0,behavior:'smooth'})}
function ctl(v,nm){const e=cart[v.k];const a=JSON.stringify(nm).replace(/"/g,'&quot;');return e?`<div class="q"><button onclick="chg('${v.k}',-1)">−</button><i>${e.q}</i><button class="p" onclick="chg('${v.k}',1)">+</button></div>`:`<button class="add" onclick="add('${v.k}',${a},'${v.lb}',${v.p})">إضافة للسلة</button>`}
function render(){let h='';D.forEach((c,ci)=>{if(cat>=0&&cat!==ci)return;const its=c.items.filter(i=>!q||(i.name+c.n).includes(q));if(!its.length)return;h+=`<h2>${c.n}</h2><div class="grid">`+its.map(i=>`<div class="card"><div class="nm">${i.name}${i.nw?'<span class="new">جديد</span>':''}</div>${i.d?'<div class="ds">'+i.d.split('-').map(x=>'<em>'+x+'</em>').join('')+'</div>':''}`+i.v.map(v=>{const one=i.v.length===1;return`<div class="v"><span>${one?'':v.lb}<b>${v.p} ج.م</b></span>${ctl(v,i.name)}</div>`}).join('')+'</div>').join('')+'</div>'});$('m').innerHTML=h||'<div class="em">لا توجد نتائج</div>'}
function add(k,n,lb,p){cart[k]={n,lb,p,q:1};upd()}
function chg(k,d){cart[k].q+=d;if(cart[k].q<=0)delete cart[k];upd()}
function tot(){let n=0,t=0;for(const k in cart){n+=cart[k].q;t+=cart[k].q*cart[k].p}return[n,t]}
function upd(){const[n,t]=tot();$('fn').textContent=n;$('ft').textContent=t;$('fc').style.display=n?'block':'none';render();if($('ov').classList.contains('on'))drawCart()}
function drawCart(){const[n,t]=tot();$('ct').textContent=t;if(!n){$('ci').innerHTML='<div class="em">السلة فارغة</div>';return}
$('ci').innerHTML=Object.keys(cart).map(k=>{const e=cart[k];return`<div class="ci"><div>${e.n}<small>${e.lb==='السعر'?'':e.lb+' – '}${e.p} ج.م × ${e.q} = ${e.p*e.q}</small></div><div class="q"><button onclick="chg('${k}',-1)">−</button><i>${e.q}</i><button class="p" onclick="chg('${k}',1)">+</button></div></div>`}).join('')}
function openCart(){$('ov').classList.add('on');drawCart()}
function closeCart(){$('ov').classList.remove('on')}
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))closeCart()});
document.querySelectorAll('#seg input').forEach(r=>r.addEventListener('change',()=>{const d=r.value==='d';document.querySelectorAll('#seg label').forEach(l=>l.classList.toggle('on',l.contains(r)&&r.checked));$('fd').style.display=d?'grid':'none';$('fi').style.display=d?'none':'grid'}));
$('s').addEventListener('input',e=>{q=e.target.value.trim();render()});
function send(){const[n,t]=tot();if(!n)return alert('السلة فارغة');const d=document.querySelector('input[name=t]:checked').value==='d';
let nm=$('nm').value.trim(),ph=$('ph').value.trim(),ad=$('ad').value.trim(),tb=$('tb').value.trim();
if(d&&(!nm||!ad||!ph))return alert('من فضلك اكتب الاسم ورقم الموبايل والعنوان');if(!d&&!tb)return alert('من فضلك اكتب رقم الطاولة');
let m='🧾 *فاتورة طلب جديد – بيتزا وفطائر دودي*\n━━━━━━━━━━━━━━\n';let i=1;
for(const k in cart){const e=cart[k];m+=`${i++}. ${e.n}${e.lb==='السعر'?'':' ('+e.lb+')'}\n    ${e.q} × ${e.p} = *${e.q*e.p} ج.م*\n`}
m+=`━━━━━━━━━━━━━━\n🔢 عدد الأصناف: ${n}\n💰 *الإجمالي: ${t} ج.م*\n━━━━━━━━━━━━━━\n`;
m+=d?`🛵 *توصيل للمنزل*\n👤 الاسم: ${nm}\n📞 الموبايل: ${ph}\n📍 العنوان: ${ad}\n`:`🍽️ *داخل المطعم*\n🪑 رقم الطاولة: ${tb}\n`;
const nt=$('nt').value.trim();if(nt)m+=`📝 ملاحظات: ${nt}\n`;
if(DEMO||!WA){alert('🧪 نسخة تجريبية – لم يُرسل الطلب لأي جهة.\n\nهكذا ستصل الفاتورة على واتساب:\n\n'+m);return}
window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`,'_blank')}
tabs();render();
</script>
</body>
</html>
